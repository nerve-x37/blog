<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Bağırsak mikrobiyomu ve lifin parçalanması</title>
  <desc id="desc">Şemada besin lifinin kalın bağırsaktaki mikroorganizmalar tarafından parçalanması ve kısa zincirli yağ asitlerinin oluşması gösterilir.</desc>
  <rect width="960" height="520" rx="28" fill="#f3f5f2"/>
  <text x="480" y="58" text-anchor="middle" fill="#263832" font-family="Arial, sans-serif" font-size="27" font-weight="700">Bağırsak mikrobiyomu: yaşayan bir ekosistem</text>
  <rect x="50" y="135" width="220" height="250" rx="22" fill="#ffffff" stroke="#d7e2db" stroke-width="3"/>
  <text x="160" y="183" text-anchor="middle" fill="#354a3e" font-family="Arial, sans-serif" font-size="21" font-weight="700">Besin lifleri</text>
  <g fill="#78a96b">
    <path d="M111 260c-22-29-17-54-4-70 25 12 35 33 22 61 24-19 48-13 61 2-17 23-38 28-63 15 14 25 3 48-17 57-18-22-17-44 1-65z"/>
    <path d="M178 314c-9-23-1-40 12-50 17 13 20 30 8 48 19-9 33-1 40 12-15 14-30 15-46 4 7 19-2 34-17 39-11-18-9-35 3-53z"/>
  </g>
  <text x="160" y="356" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="16">sebze, meyve, baklagil,</text>
  <text x="160" y="379" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="16">tam tahıl ve kuruyemiş</text>
  <path d="M290 260h76" stroke="#779b87" stroke-width="5" stroke-linecap="round"/>
  <path d="m354 246 16 14-16 14" fill="none" stroke="#779b87" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="385" y="135" width="220" height="250" rx="22" fill="#ffffff" stroke="#d7e2db" stroke-width="3"/>
  <text x="495" y="183" text-anchor="middle" fill="#354a3e" font-family="Arial, sans-serif" font-size="21" font-weight="700">Kalın bağırsak</text>
  <path d="M454 224c-22 0-30 15-30 37v39c0 20 10 30 29 30h84c19 0 29-10 29-30v-39c0-22-9-37-30-37h-8v22c0 9-6 15-15 15h-35c-9 0-15-6-15-15v-22z" fill="none" stroke="#d28c72" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7560a8">
    <circle cx="459" cy="265" r="7"/><circle cx="487" cy="298" r="6"/><circle cx="521" cy="248" r="7"/>
    <circle cx="544" cy="284" r="6"/><circle cx="468" cy="322" r="5"/><circle cx="527" cy="319" r="5"/>
  </g>
  <g fill="#e1a34b">
    <circle cx="491" cy="238" r="4"/><circle cx="551" cy="251" r="4"/><circle cx="446" cy="294" r="4"/>
  </g>
  <text x="495" y="366" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="16">mikroplar lifin bir kısmını</text>
  <text x="495" y="389" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="16">fermente eder</text>
  <path d="M625 260h76" stroke="#779b87" stroke-width="5" stroke-linecap="round"/>
  <path d="m689 246 16 14-16 14" fill="none" stroke="#779b87" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="135" width="190" height="250" rx="22" fill="#ffffff" stroke="#d7e2db" stroke-width="3"/>
  <text x="815" y="183" text-anchor="middle" fill="#354a3e" font-family="Arial, sans-serif" font-size="20" font-weight="700">Ürünler ve etkiler</text>
  <g fill="#d28c72">
    <circle cx="785" cy="236" r="13"/><circle cx="815" cy="236" r="13"/><circle cx="845" cy="236" r="13"/>
  </g>
  <text x="815" y="281" text-anchor="middle" fill="#354a3e" font-family="Arial, sans-serif" font-size="17" font-weight="700">Kısa zincirli</text>
  <text x="815" y="304" text-anchor="middle" fill="#354a3e" font-family="Arial, sans-serif" font-size="17" font-weight="700">yağ asitleri</text>
  <text x="815" y="344" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="15">bağırsak ortamı ve</text>
  <text x="815" y="366" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="15">vücut işlevleriyle</text>
  <text x="815" y="388" text-anchor="middle" fill="#596b60" font-family="Arial, sans-serif" font-size="15">ilişkilidir</text>
  <text x="480" y="462" text-anchor="middle" fill="#68766e" font-family="Arial, sans-serif" font-size="15">Şematik anlatım; süreç ve etkiler kişiye ve beslenme örüntüsüne göre değişebilir.</text>
</svg>
