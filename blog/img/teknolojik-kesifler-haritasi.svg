<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Teknolojik keşiflerin birbirine bağlanan yolları</title>
  <desc id="desc">Besin ve yerleşim, enerji ve hareket, kayıt ve iletişim, hesaplama ve otomasyon rotalarını gösteren şematik harita.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b3150"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <path d="M170 195 C320 195 320 340 470 340 S620 195 770 195 S920 340 1030 340" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <path d="M170 475 C320 475 320 340 470 340 S620 475 770 475 S920 340 1030 340" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <g fill="#15243a" stroke="#93c5fd" stroke-width="4">
    <circle cx="170" cy="195" r="44"/><circle cx="470" cy="340" r="44"/>
    <circle cx="770" cy="195" r="44"/><circle cx="1030" cy="340" r="44"/>
    <circle cx="170" cy="475" r="44"/><circle cx="770" cy="475" r="44"/>
  </g>
  <g fill="#eaf2ff" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="170" y="112" font-size="24" font-weight="700">BESİN &amp; YERLEŞİM</text>
    <text x="170" y="202" font-size="22">Aletler</text>
    <text x="170" y="265" font-size="17" fill="#b9c9df">Tarım · şehirler</text>
    <text x="470" y="257" font-size="24" font-weight="700">KAYIT &amp; BİLGİ</text>
    <text x="470" y="348" font-size="22">Yazı</text>
    <text x="470" y="410" font-size="17" fill="#b9c9df">Kâğıt · matbaa</text>
    <text x="770" y="112" font-size="24" font-weight="700">ENERJİ &amp; HAREKET</text>
    <text x="770" y="202" font-size="22">Tekerlek</text>
    <text x="770" y="265" font-size="17" fill="#b9c9df">Buhar · elektrik</text>
    <text x="1030" y="257" font-size="24" font-weight="700">AĞLAR</text>
    <text x="1030" y="348" font-size="22">İnternet</text>
    <text x="1030" y="410" font-size="17" fill="#b9c9df">Bilgiye erişim</text>
    <text x="170" y="392" font-size="24" font-weight="700">HESAPLAMA</text>
    <text x="170" y="482" font-size="22">Transistör</text>
    <text x="170" y="545" font-size="17" fill="#b9c9df">Bilgisayar · yapay zekâ</text>
    <text x="770" y="392" font-size="24" font-weight="700">YENİ SINIRLAR</text>
    <text x="770" y="482" font-size="22">Kuantum</text>
    <text x="770" y="545" font-size="17" fill="#b9c9df">Araştırma · olasılıklar</text>
    <text x="600" y="622" font-size="16" fill="#9fb4d0">Tek bir çizgi değil: ihtiyaçlar, fikirler ve insanlar arasında bir ağ</text>
  </g>
</svg>
