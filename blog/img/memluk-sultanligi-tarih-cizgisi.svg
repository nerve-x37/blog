  <text x="66" y="115" fill="#59675a" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">AYNİCÂLÛT'TAN OSMANLI FETHİNE · 1250–1517</text>
  <path d="M120 275c130-80 230-80 350-10s170 82 275 14 190-70 335-15" fill="none" stroke="#f4e7ca" stroke-width="16" stroke-linecap="round"/>
  <path d="M120 275c130-80 230-80 350-10s170 82 275 14 190-70 335-15" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
