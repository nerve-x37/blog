<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bilekte geri sayım</title>
  <desc id="desc">Filmdeki zaman sayacı fikrini çağrıştıran, bilekte yeşil ışıklı bir geri sayım ekranının özgün illüstrasyonu.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.55" stop-color="#101c1b"/>
      <stop offset="1" stop-color="#071013"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0b38b"/>
      <stop offset="0.2" stop-color="#a7825d"/>
      <stop offset="0.56" stop-color="#d1ad81"/>
      <stop offset="0.82" stop-color="#a47c57"/>
      <stop offset="1" stop-color="#6f523d"/>
    </linearGradient>
    <linearGradient id="skinLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff0c8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff0c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#75ff9a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#75ff9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="digitGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#67ff89" flood-opacity=".9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="650" fill="url(#background)"/>
  <circle cx="850" cy="170" r="290" fill="url(#greenGlow)"/>
  <path d="M0 575 1200 390v260H0Z" fill="#03090b" opacity=".58"/>
  <g transform="rotate(-11 600 325)">
    <rect x="34" y="215" width="1132" height="258" rx="129" fill="#030708" opacity=".7" filter="url(#softShadow)"/>
    <rect x="8" y="178" width="1184" height="276" rx="138" fill="url(#skin)"/>
    <rect x="38" y="191" width="1124" height="65" rx="32" fill="url(#skinLight)"/>
    <path d="M85 427c220-22 427-17 640-27 155-8 293-21 395-38" fill="none" stroke="#f4d5a5" stroke-opacity=".2" stroke-width="3"/>
    <path d="M67 277c252 18 510 9 758 3 117-3 222-8 309-17" fill="none" stroke="#5d422f" stroke-opacity=".23" stroke-width="4"/>
    <rect x="352" y="258" width="500" height="118" rx="25" fill="#111a13" fill-opacity=".72" stroke="#c5a27a" stroke-opacity=".38" stroke-width="2"/>
    <rect x="370" y="273" width="464" height="88" rx="16" fill="url(#greenGlow)" opacity=".8"/>
    <text x="602" y="341" text-anchor="middle" fill="#a2ffb5" font-family="Consolas, 'Courier New', monospace" font-size="68" font-weight="700" letter-spacing="3" filter="url(#digitGlow)">13:42:08</text>
    <circle cx="375" cy="317" r="4" fill="#a2ffb5" opacity=".8"/>
    <circle cx="829" cy="317" r="4" fill="#a2ffb5" opacity=".8"/>
  </g>
  <text x="600" y="584" text-anchor="middle" fill="#c6d6cf" font-family="Arial, sans-serif" font-size="20" letter-spacing="5" opacity=".74">TIME IS CURRENCY</text>
</svg>
