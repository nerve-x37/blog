<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Moğol İmparatorluğu'nun genişlemesi ve bölünmesi</title>
  <desc id="desc">1206'dan itibaren kurulan imparatorluğun batıya genişlemesini, 1258 Bağdat'ın alınmasını ve farklı hanlıkların ortaya çıkışını gösteren şematik tarih çizgisi.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8efd9"/>
      <stop offset="1" stop-color="#e7d8b7"/>
    </linearGradient>
    <linearGradient id="route" x1="0" x2="1">
      <stop offset="0" stop-color="#9f6941"/>
      <stop offset="1" stop-color="#506f68"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#sky)"/>
  <circle cx="1020" cy="126" r="63" fill="#d9a24e" opacity=".8"/>
  <path d="M0 405c176-63 337-30 475 4s354 42 725-42v273H0z" fill="#899579"/>
  <path d="M0 476c166-43 318-15 492 17s407 29 708-31v178H0z" fill="#536f66"/>
  <text x="64" y="76" fill="#31413b" font-family="Georgia,serif" font-size="38" font-weight="700" letter-spacing="2">MOĞOL İMPARATORLUĞU</text>
  <text x="66" y="115" fill="#59675a" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">BOZKIRDAN AVRASYA'YA · 1206–14. YÜZYIL</text>
  <path d="M155 276c213-97 386-74 574 17s222 91 318 16" fill="none" stroke="#f4e7ca" stroke-width="16" stroke-linecap="round"/>
  <path d="M155 276c213-97 386-74 574 17s222 91 318 16" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(155 276)">
      <circle r="24" fill="#9f6941" stroke="#f7ecd5" stroke-width="7"/>
