      <text y="-39" fill="#59675a" font-size="16">Hârizmşah seferi</text>
      <rect x="-91" y="40" width="182" height="32" rx="12" fill="#33433d"/>
      <text y="61" fill="#f8efd9" font-size="15" font-weight="700">BATIYA GENİŞLEME</text>
    </g>
    <g transform="translate(644 293)">
      <circle r="24" fill="#8a7650" stroke="#f7ecd5" stroke-width="7"/>
      <text y="-66" fill="#35443b" font-size="22" font-weight="700">1258</text>
      <text y="-39" fill="#59675a" font-size="16">Bağdat alındı</text>
      <rect x="-91" y="40" width="182" height="32" rx="12" fill="#33433d"/>
      <text y="61" fill="#f8efd9" font-size="15" font-weight="700">İLHANLILAR</text>
    </g>
    <g transform="translate(882 326)">
      <circle r="24" fill="#537a70" stroke="#f7ecd5" stroke-width="7"/>
