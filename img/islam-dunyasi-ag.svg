  <title id="title">İslam dünyasının tarihsel gelişimi</title>
  <desc id="desc">Hicaz'dan Şam ve Bağdat'a, farklı bölgesel merkezlere uzanan, tek bir devlet haritası olmayan şematik tarih çizgisi.</desc>
