<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PCR ile DNA çoğaltmanın temel aşamaları</title>
  <desc id="desc">Hedef DNA ısıtılarak iki zincire ayrılır. Primerler hedef bölgeye bağlanır, DNA polimeraz yeni zincirleri kurar ve döngü tekrarlandıkça hedef parçanın kopyaları artar.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#62727a"/>
    </marker>
    <style>
      .label { font: 700 25px Inter, Arial, sans-serif; fill: #183039; }
      .caption { font: 400 18px Inter, Arial, sans-serif; fill: #52636a; }
      .panel { fill: #fff; stroke: #d7e0df; stroke-width: 2; }
      .strand-a { stroke: #357da0; }
      .strand-b { stroke: #d2793b; }
      .strand { fill: none; stroke-width: 8; stroke-linecap: round; }
      .primer { stroke: #775caa; stroke-width: 9; stroke-linecap: round; }
      .arrow { stroke: #62727a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#eef3f0"/>
  <text x="600" y="58" text-anchor="middle" class="label">PCR, seçilmiş bir DNA bölgesini döngülerle çoğaltır</text>

  <g transform="translate(30 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">1. Hedef DNA</text>
    <text x="125" y="88" text-anchor="middle" class="caption">İncelenecek bölge seçilir</text>
    <path class="strand strand-a" d="M48 185h58m34 0h62"/>
    <path class="strand strand-b" d="M48 220h58m34 0h62"/>
    <rect x="106" y="171" width="34" height="63" rx="7" fill="#f3c76c"/>
    <text x="125" y="300" text-anchor="middle" class="caption">Primerler hedef</text>
    <text x="125" y="328" text-anchor="middle" class="caption">DNA bölgesini tanımlar</text>
  </g>

  <path class="arrow" d="M288 322h34"/>

  <g transform="translate(335 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">2. Denatürasyon</text>
    <text x="125" y="88" text-anchor="middle" class="caption">Isı DNA zincirlerini ayırır</text>
    <path class="strand strand-a" d="M56 185h135"/>
    <path class="strand strand-b" d="M56 220h135"/>
    <path d="M112 251v40m26-40v40" stroke="#d2793b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="125" y="345" text-anchor="middle" class="caption">Çift sarmalın zincirleri</text>
    <text x="125" y="373" text-anchor="middle" class="caption">birbirinden ayrılır</text>
  </g>

  <path class="arrow" d="M593 322h34"/>

  <g transform="translate(640 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">3. Bağlanma ve uzama</text>
    <text x="125" y="88" text-anchor="middle" class="caption">Primerler hedefe tutunur</text>
    <path class="strand strand-a" d="M48 185h150"/>
    <path class="strand strand-b" d="M48 220h150"/>
    <path class="primer" d="M88 185h45"/>
    <path class="primer" d="M158 220h-45"/>
    <path d="M108 280h50" class="arrow"/>
    <text x="125" y="345" text-anchor="middle" class="caption">DNA polimeraz,</text>
    <text x="125" y="373" text-anchor="middle" class="caption">yeni zincirleri kurar</text>
  </g>

  <path class="arrow" d="M898 322h34"/>

  <g transform="translate(945 108)">
    <rect class="panel" width="225" height="430" rx="20"/>
    <text x="112" y="54" text-anchor="middle" class="label">4. Tekrar</text>
    <text x="112" y="88" text-anchor="middle" class="caption">Kopya sayısı artar</text>
    <path class="strand strand-a" d="M46 166h47m24 0h62"/>
    <path class="strand strand-b" d="M46 190h47m24 0h62"/>
    <path class="strand strand-a" d="M46 236h47m24 0h62"/>
    <path class="strand strand-b" d="M46 260h47m24 0h62"/>
    <path class="strand strand-a" d="M46 306h47m24 0h62"/>
    <path class="strand strand-b" d="M46 330h47m24 0h62"/>
    <text x="112" y="385" text-anchor="middle" class="caption">Her turda yeni</text>
    <text x="112" y="411" text-anchor="middle" class="caption">kalıplar oluşur</text>
  </g>

  <text x="600" y="603" text-anchor="middle" class="caption">Şematik anlatım: primerler hangi DNA bölgesinin çoğaltılacağını belirler.</text>
</svg>
