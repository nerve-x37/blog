  <path d="M0 365 C125 360 230 340 350 330 C405 326 455 303 560 320 C700 340 850 370 1100 380 L1100 505 0 505Z" fill="#8fc9df"/>
  <path d="M0 365 C125 360 230 340 350 330 C405 326 455 303 560 320 C700 340 850 370 1100 380 L1100 505 0 505Z" fill="url(#gravel)"/>
  <path d="M0 505 C250 490 450 520 650 505 C820 492 980 510 1100 500 L1100 600 0 600Z" fill="#8f8170"/>
  <path d="M0 365 C125 360 230 340 350 330 C405 326 455 303 560 320 C700 340 850 370 1100 380" fill="none" stroke="#146b96" stroke-width="4" stroke-dasharray="11 7"/>
  <path d="M570 345 C655 352 700 360 765 368" fill="none" stroke="#237eaa" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M760 366 C820 373 860 376 910 379" fill="none" stroke="#237eaa" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M214 135 214 245" fill="none" stroke="#37535e" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M282 150 282 267" fill="none" stroke="#37535e" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M340 185 340 288" fill="none" stroke="#37535e" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M0 310 C68 303 104 300 144 292" fill="none" stroke="#3b9ec4" stroke-width="8" stroke-linecap="round"/>
  <path d="M465 306 C482 299 495 301 507 307 C518 313 530 311 544 307" fill="none" stroke="#1688b5" stroke-width="9" stroke-linecap="round"/>
  <path d="M0 315 C44 309 70 309 104 305" fill="none" stroke="#78d3e8" stroke-width="3"/>
  <path d="M900 245 900 440" stroke="#253e49" stroke-width="12"/>
  <path d="M900 378 900 440" stroke="#1688b5" stroke-width="7"/>
  <path d="M882 245 918 245" stroke="#253e49" stroke-width="8"/>
  <path d="M900 278 900 345" fill="none" stroke="#37535e" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <g fill="#fff" opacity=".92">
    <rect x="38" y="46" width="150" height="44" rx="8"/>
    <rect x="209" y="98" width="155" height="43" rx="8"/>
    <rect x="660" y="205" width="195" height="42" rx="8"/>
    <rect x="693" y="382" width="145" height="40" rx="8"/>
    <rect x="647" y="438" width="180" height="42" rx="8"/>
    <rect x="418" y="244" width="176" height="44" rx="8"/>
    <rect x="848" y="202" width="105" height="38" rx="8"/>
    <rect x="57" y="530" width="225" height="40" rx="8"/>
