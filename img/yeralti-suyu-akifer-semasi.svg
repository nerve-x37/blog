<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Yeraltı suyu, akifer ve pınar şeması</title>
  <desc id="desc">Yağışın zemine sızarak akiferi beslemesi, yeraltı suyunun su tablası altında gözenek ve çatlaklarda hareket etmesi, bir pınardan çıkması ve kuyuyla çekilmesini gösteren kesit.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#f8fbfc"/>
    </linearGradient>
    <pattern id="gravel" width="38" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="2" fill="#647b82" opacity=".35"/>
      <circle cx="25" cy="19" r="3" fill="#647b82" opacity=".28"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#237eaa"/>
    </marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#37535e"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="url(#sky)"/>
  <path d="M0 300 C140 280 150 190 250 190 C340 190 380 285 470 310 C560 335 620 330 720 300 C820 270 850 190 960 200 C1040 205 1050 250 1100 250 L1100 600 0 600Z" fill="#d2bd91"/>
