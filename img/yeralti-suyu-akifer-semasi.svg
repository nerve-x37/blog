  <g fill="#183641" font-family="Arial, sans-serif" font-size="19" font-weight="700">
    <text x="54" y="75">Yağış ve kar</text>
    <text x="222" y="126">Beslenme alanı</text>
    <text x="675" y="233">Doymamış bölge</text>
    <text x="708" y="408">Su tablası</text>
    <text x="662" y="465">Akifer</text>
    <text x="430" y="272">Pınar: doğal çıkış</text>
    <text x="861" y="227">Kuyu</text>
    <text x="72" y="557">Az geçirgen kaya tabakası</text>
  </g>
  <g fill="#183641" font-family="Arial, sans-serif" font-size="15">
    <text x="645" y="487">Gözenek ve çatlaklarda su</text>
    <text x="694" y="355">Yeraltı suyu akış yönü</text>
  </g>
</svg>
