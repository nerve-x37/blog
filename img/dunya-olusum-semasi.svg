<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Dünya'nın oluşum aşamaları</title>
  <desc id="desc">Güneş bulutsusundaki gaz ve toz, kütleçekimiyle yoğunlaşıp katı tanelere ve gezegenimsilere dönüştü. Çarpışmalarla büyüyen genç Dünya eridi; demir-nikel metali çekirdeğe, silikat kayaçlar ise mantoya ayrıştı.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#62727a"/>
    </marker>
    <style>
      .label { font: 700 25px Inter, Arial, sans-serif; fill: #183039; }
      .caption { font: 400 18px Inter, Arial, sans-serif; fill: #52636a; }
      .panel { fill: #fff; stroke: #d7e0df; stroke-width: 2; }
      .dust { fill: #a5a17e; }
      .rock { fill: #687f83; }
      .metal { fill: #c56f3d; }
      .arrow { stroke: #62727a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="#eef3f0"/>
  <text x="600" y="58" text-anchor="middle" class="label">Dünya, küçük katı cisimlerin birleşmesiyle büyüdü</text>

  <g transform="translate(30 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">1. Güneş bulutsusu</text>
    <text x="125" y="88" text-anchor="middle" class="caption">Gaz ve toz diski</text>
    <circle cx="125" cy="216" r="52" fill="#f3c76c"/>
    <ellipse cx="125" cy="216" rx="105" ry="27" fill="none" stroke="#a5a17e" stroke-width="9" transform="rotate(-18 125 216)"/>
    <circle class="dust" cx="47" cy="188" r="6"/>
    <circle class="dust" cx="76" cy="248" r="7"/>
    <circle class="dust" cx="177" cy="181" r="5"/>
    <circle class="dust" cx="206" cy="240" r="7"/>
    <text x="125" y="344" text-anchor="middle" class="caption">Merkezde Güneş,</text>
    <text x="125" y="372" text-anchor="middle" class="caption">çevresinde dönen disk</text>
  </g>

  <path class="arrow" d="M288 322h34"/>

  <g transform="translate(335 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">2. Birikme</text>
    <text x="125" y="88" text-anchor="middle" class="caption">Taneler birleşip büyür</text>
    <circle class="dust" cx="72" cy="190" r="13"/>
    <circle class="dust" cx="164" cy="174" r="11"/>
    <circle class="rock" cx="123" cy="246" r="27"/>
    <circle class="rock" cx="179" cy="292" r="17"/>
    <circle class="metal" cx="72" cy="302" r="11"/>
    <path d="M80 209 101 229m43-41-1 35m42 45-17 13" class="arrow"/>
    <text x="125" y="355" text-anchor="middle" class="caption">Toz, kaya ve metal</text>
    <text x="125" y="383" text-anchor="middle" class="caption">gezegenimsileri oluşturur</text>
  </g>

  <path class="arrow" d="M593 322h34"/>

  <g transform="translate(640 108)">
    <rect class="panel" width="250" height="430" rx="20"/>
    <text x="125" y="54" text-anchor="middle" class="label">3. Genç Dünya</text>
    <text x="125" y="88" text-anchor="middle" class="caption">Çarpışmalar ısıtır</text>
    <circle cx="125" cy="235" r="77" fill="#d77d50"/>
    <circle cx="125" cy="235" r="54" fill="#f3c76c"/>
    <path d="M56 178 82 194m89-20-19 24m47 75-27-6" stroke="#62727a" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="125" y="354" text-anchor="middle" class="caption">Çarpışma ve sıkışma</text>
    <text x="125" y="382" text-anchor="middle" class="caption">iç ısıyı artırır</text>
  </g>

  <path class="arrow" d="M898 322h34"/>

  <g transform="translate(945 108)">
    <rect class="panel" width="225" height="430" rx="20"/>
    <text x="112" y="54" text-anchor="middle" class="label">4. Katmanlar</text>
    <text x="112" y="88" text-anchor="middle" class="caption">Metal merkeze çöker</text>
    <circle cx="112" cy="235" r="75" fill="#718a8d"/>
    <circle cx="112" cy="235" r="38" fill="#c56f3d"/>
    <path d="M71 177 88 199m49-22-16 21m44 57-28-9m-29 86v-28" stroke="#c56f3d" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="112" y="354" text-anchor="middle" class="caption">Demir-nikel çekirdek,</text>
    <text x="112" y="382" text-anchor="middle" class="caption">silikat manto ve kabuk</text>
  </g>

  <text x="600" y="603" text-anchor="middle" class="caption">Oluşum aşamaları basitleştirilmiştir; tarihler ve ayrıntılar araştırılmaya devam ediyor.</text>
</svg>
